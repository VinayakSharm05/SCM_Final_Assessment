<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Design Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        :root {
            --primary: #9B8579;
            --secondary: #E5DCD6;
            --text: #4A4A4A;
        }

        body {
            background-color: var(--secondary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(245,245,245,0.8) 100%);
        }

        .login-wrapper {
            display: flex;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }

        .login-image {
            flex: 1;
            background-size: cover;
            background-position: center;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            width: 40%;
        }

        .login-container {
            flex: 1;
            background-color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 36px;
            color: var(--primary);
            font-weight: 300;
            margin-bottom: 10px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(155,133,121,0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #8A7569;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #8A7569;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }

            .login-image {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-image">
            <img src="./image.png" alt="">
        </div>
        <div class="login-container">
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Log in to your E-Design account</p>
            </div>
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            <div class="login-footer">
                <a href="signup.html">New User?</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting normally
    
            // Get the input values
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
    
            // Get stored users data from localStorage
            var users = JSON.parse(localStorage.getItem('users')) || []; // Default to an empty array if no users
    
            // Find a matching user by email and password
            var loggedInUser = users.find(function(user) {
                return user.email === email && user.password === password;
            });
    
            // If a matching user is found, redirect to index page
            if (loggedInUser) {
                window.location.href = "index.html";
            } else {
                // If login fails, show an alert and redirect to signup page
                alert("Invalid email or password. Please sign up.");
                window.location.href = "signup.html";
            }
        });
        document.getElementById('login-form').addEventListener('submit', function(event) {
    event.preventDefault();
    
    // Get the username from the input field
    const username = document.getElementById('username').value;
    
    // Call loginUser with the entered username
    loginUser(username);
});

function loginUser(name) {
    // Store the username in localStorage
    localStorage.setItem('userName', name);
    
    // Redirect to the homepage or another page after login (optional)
    window.location.href = 'index.html';  // Or whatever page you want to redirect to
}

    </script>
    
   
</body>
</html>
